[package]
name = "jakkals"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Jakkals (YAH-kuls), Afrikaans for 'jackal': a small coding agent whose every model call, tool call and limit is written down"
repository = "https://github.com/noctonca/jakkals"
readme = "README.md"
keywords = ["agent", "llm", "mcp", "cli", "openrouter"]
categories = ["command-line-utilities", "development-tools"]
# Ship only code, README and licences (the docs live in the repo).
include = ["src/**", "README.md", "LICENSE-*"]

# Every dependency added here must first earn its row in
# docs/ARCHITECTURE.md "The dependency register".
[dependencies]
clap = { version = "4.6", features = ["derive"] }
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.11.0"
shlex = "2.0.1"
tokio = { version = "1.53", default-features = false, features = ["rt", "macros"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
